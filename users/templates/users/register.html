{% extends 'users/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Register</h3>
            </div>
            <div class="card-body">
                <form id="registrationForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="first_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="last_name" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="passport_number" class="form-label">Passport Number</label>
                            <input type="text" class="form-control" id="passport_number" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="date_of_birth" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="date_of_birth" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="hotel_name" class="form-label">Hotel Name</label>
                            <input type="text" class="form-control" id="hotel_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="room_number" class="form-label">Room Number</label>
                            <input type="text" class="form-control" id="room_number" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="check_in_date" class="form-label">Check-in Date</label>
                            <input type="date" class="form-control" id="check_in_date" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="check_out_date" class="form-label">Check-out Date</label>
                            <input type="date" class="form-control" id="check_out_date" required>
                        </div>
                    </div>
                    
                    <!-- Photo Upload Section -->
                    <div class="mb-4">
                        <h5 class="mb-3">Face Photo</h5>
                        <ul class="nav nav-tabs" id="photoTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="camera-tab" data-bs-toggle="tab" data-bs-target="#camera" type="button" role="tab">
                                    Use Camera
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="upload-tab" data-bs-toggle="tab" data-bs-target="#upload" type="button" role="tab">
                                    Upload Photo
                                </button>
                            </li>
                        </ul>
                        
                        <div class="tab-content mt-3" id="photoTabContent">
                            <!-- Camera Tab -->
                            <div class="tab-pane fade show active" id="camera" role="tabpanel">
                                <div class="camera-container mb-3">
                                    <video id="video" autoplay playsinline></video>
                                    <div class="camera-overlay">Please look straight at the camera</div>
                                    <canvas id="canvas" style="display: none;"></canvas>
                                </div>
                                <button type="button" class="btn btn-primary" id="captureBtn">Capture Photo</button>
                            </div>
                            
                            <!-- Upload Tab -->
                            <div class="tab-pane fade" id="upload" role="tabpanel">
                                <div class="mb-3">
                                    <input type="file" class="form-control" id="photoUpload" accept="image/*">
                                    <div class="form-text">Please upload a clear front-facing photo</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Preview Section -->
                        <div id="previewSection" class="mt-3" style="display: none;">
                            <h6>Preview:</h6>
                            <img id="preview" src="" alt="Face photo preview" class="img-fluid" style="max-width: 200px;">
                            <button type="button" class="btn btn-secondary btn-sm ms-2" id="retakeBtn">Retake</button>
                        </div>
                    </div>
                    
                    <div class="text-center">
                        <button type="submit" class="btn btn-success" id="submitBtn" disabled>Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let captureBtn = document.getElementById('captureBtn');
let submitBtn = document.getElementById('submitBtn');
let photoUpload = document.getElementById('photoUpload');
let preview = document.getElementById('preview');
let previewSection = document.getElementById('previewSection');
let retakeBtn = document.getElementById('retakeBtn');
let faceImage = null;
let stream = null;

// Initialize camera when camera tab is shown
document.getElementById('camera-tab').addEventListener('click', initializeCamera);

// Initialize camera
function initializeCamera() {
    if (!stream) {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(videoStream => {
                stream = videoStream;
                video.srcObject = stream;
            })
            .catch(err => {
                console.error('Error accessing camera:', err);
                alert('Error accessing camera. Please make sure you have granted camera permissions.');
            });
    }
}

// Stop camera when upload tab is shown
document.getElementById('upload-tab').addEventListener('click', () => {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
});

// Capture photo
captureBtn.addEventListener('click', () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    faceImage = canvas.toDataURL('image/jpeg');
    preview.src = faceImage;
    previewSection.style.display = 'block';
    submitBtn.disabled = false;
});

// Handle file upload
photoUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            faceImage = e.target.result;
            preview.src = faceImage;
            previewSection.style.display = 'block';
            submitBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    }
});

// Retake photo
retakeBtn.addEventListener('click', () => {
    faceImage = null;
    preview.src = '';
    previewSection.style.display = 'none';
    submitBtn.disabled = true;
    photoUpload.value = '';
    if (document.querySelector('#camera.active')) {
        initializeCamera();
    }
});

// Handle form submission
document.getElementById('registrationForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (!faceImage) {
        alert('Please capture or upload a face photo');
        return;
    }

    const formData = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        passport_number: document.getElementById('passport_number').value,
        date_of_birth: document.getElementById('date_of_birth').value,
        hotel_name: document.getElementById('hotel_name').value,
        room_number: document.getElementById('room_number').value,
        check_in_date: document.getElementById('check_in_date').value,
        check_out_date: document.getElementById('check_out_date').value,
        face_image: faceImage
    };

    try {
        const response = await fetch('/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        });

        const data = await response.json();
        if (response.ok) {
            window.location.href = '/login/';
        } else {
            alert(data.error || 'Registration failed');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('An error occurred during registration');
    }
});

// Get CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Clean up camera when leaving page
window.addEventListener('beforeunload', () => {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
});

// Initialize camera on page load if camera tab is active
if (document.querySelector('#camera.active')) {
    initializeCamera();
}
</script>

<style>
.camera-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
}

.camera-container video {
    width: 100%;
    border-radius: 8px;
}

.camera-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.5);
    color: white;
    padding: 8px 16px;
    border-radius: 4px;
}

#preview {
    border-radius: 8px;
    border: 2px solid #dee2e6;
}
</style>
{% endblock %}
